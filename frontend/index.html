<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8ebef">
  <title>青筮问道</title>
  <link rel="stylesheet" href="./app/globals.css?v=20260722-neutral5">
  <style>
    :root{--ink:#454b54;--muted:#727983;--line:rgba(126,135,145,.2);--glass:rgba(250,251,253,.78)}
    *{box-sizing:border-box}html{background:#e5e8ec}body{margin:0;color:var(--ink);background:linear-gradient(#d8dce2,#eef0f3 70%,#e4e7eb);font-family:"Songti SC","Noto Serif SC","Microsoft YaHei",serif}
    button,a{font:inherit}.home{position:relative;width:min(100%,540px);min-height:100vh;margin:auto;overflow:hidden;padding-bottom:102px;background:#e8ebef;box-shadow:0 0 50px rgba(48,55,64,.16)}
    .hero{position:relative;height:min(655px,121.5vw);max-height:655px;background:url('./assets/home-silver-clean-background.png') center top/100% auto no-repeat}
    .hero::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:98px;background:linear-gradient(transparent,#e7eaee)}
    .hero-star-chart{position:absolute;z-index:1;left:50%;top:39.5%;width:82%;height:auto;display:block;transform:translate(-50%,-50%);border-radius:50%;opacity:.76;mix-blend-mode:screen;pointer-events:none;filter:contrast(1.06) brightness(1.04);transform-origin:center;will-change:transform;animation:starChartEnter 3s cubic-bezier(.18,.78,.22,1) both,starChartOrbit 60s linear 3s infinite}
    @keyframes starChartEnter{0%{transform:translate(-50%,-50%) scale(.015) rotate(-1080deg)}100%{transform:translate(-50%,-50%) scale(1) rotate(0deg)}}
    @keyframes starChartOrbit{from{transform:translate(-50%,-50%) scale(1) rotate(0deg)}to{transform:translate(-50%,-50%) scale(1) rotate(360deg)}}
    .hero-logo-glow{position:absolute;z-index:2;left:50%;top:22.5%;width:27%;aspect-ratio:531/956;transform:translateX(-50%);mix-blend-mode:screen;pointer-events:none;animation:logoGlowReveal 1.6s ease-out .5s both}
    .hero-logo-glow i{position:absolute;left:50%;width:115%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.96) 0%,rgba(255,255,255,.78) 17%,rgba(247,249,252,.43) 39%,rgba(238,242,247,.16) 58%,transparent 76%);filter:blur(8px)}
    .hero-logo-glow i:nth-child(1){top:8%}.hero-logo-glow i:nth-child(2){top:34%}.hero-logo-glow i:nth-child(3){top:59%}.hero-logo-glow i:nth-child(4){top:84%}
    .hero-vertical-logo{position:absolute;z-index:3;left:50%;top:22.5%;width:32%;height:auto;display:block;transform:translateX(-50%);mix-blend-mode:multiply;pointer-events:none;filter:contrast(1.04) drop-shadow(0 1px 2px rgba(62,69,78,.18));animation:logoReveal 1.6s ease-out .5s both}
    .hero-vertical-motto{position:absolute;z-index:4;left:58%;top:38.5%;margin:0;color:#737d86;font-family:"Microsoft YaHei","Microsoft YaHei UI",sans-serif;font-size:11px;font-weight:400;line-height:1;letter-spacing:8px;writing-mode:vertical-rl;text-orientation:upright;white-space:pre;text-shadow:0 1px 1px rgba(255,255,255,.8),0 0 7px rgba(255,255,255,.38);pointer-events:none;animation:mottoType 2.7s steps(9,end) 2.1s both}
    @keyframes logoGlowReveal{0%{opacity:0;transform:translateX(-50%) scale(.78);filter:blur(18px)}55%{opacity:.72}100%{opacity:1;transform:translateX(-50%) scale(1);filter:none}}
    @keyframes logoReveal{0%{opacity:0;transform:translateX(-50%) scale(.96);filter:blur(9px) contrast(.85)}100%{opacity:1;transform:translateX(-50%) scale(1);filter:contrast(1.04) drop-shadow(0 1px 2px rgba(62,69,78,.18))}}
    @keyframes mottoType{0%{opacity:0;clip-path:inset(0 0 100% 0)}1%{opacity:1}100%{opacity:1;clip-path:inset(0 0 0 0)}}
    @media(prefers-reduced-motion:reduce){.hero-star-chart,.hero-logo-glow,.hero-vertical-logo,.hero-vertical-motto{animation:none}.hero-star-chart{transform:translate(-50%,-50%)}.hero-logo-glow,.hero-vertical-logo{transform:translateX(-50%)}.hero-vertical-motto{opacity:1;clip-path:none}}
    .menu{z-index:5}
    .menu{position:absolute;z-index:2;right:8%;top:3.5%;width:42px;height:38px;border:0;background:transparent;display:grid;align-content:center;gap:7px;padding:4px;filter:drop-shadow(0 2px 3px #fff)}
    .menu i{display:block;height:2px;border-radius:2px;background:#eef1f4;box-shadow:0 1px 2px #66717c}.menu i:nth-child(2){width:80%;justify-self:end}
    .content{position:relative;z-index:3;margin-top:-37px;padding:0 27px 22px}
    .glass{border:1px solid rgba(255,255,255,.82);background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(230,234,239,.68));box-shadow:0 14px 30px rgba(69,78,89,.18),inset 0 1px 0 #fff;backdrop-filter:blur(19px) saturate(115%);-webkit-backdrop-filter:blur(19px) saturate(115%)}
    .modules{display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden;border-radius:19px}
    .module{position:relative;min-width:0;padding:25px 5px 20px;color:var(--ink);text-align:center;text-decoration:none}
    .open-tag{position:absolute;z-index:2;right:5px;top:6px;padding:3px 5px;border:1px solid rgba(255,245,206,.72);border-radius:7px 7px 7px 2px;background:linear-gradient(145deg,#d8bd78,#a98232);color:#fffaf0;font:6px/1.1 "Microsoft YaHei",sans-serif;letter-spacing:.3px;box-shadow:0 3px 8px rgba(117,86,29,.22),inset 0 1px 0 rgba(255,255,255,.5)}
    .module+.module{border-left:1px solid var(--line)}
    .module-icon{position:relative;width:58px;height:58px;margin:0 auto 17px;display:grid;place-items:center;border:1px solid #aeb5bd;border-radius:50%;color:#626a74;font:24px serif;box-shadow:inset 0 0 0 5px rgba(255,255,255,.5),0 3px 8px rgba(63,72,82,.1)}
    .module-icon::before,.module-icon::after{content:"";position:absolute;inset:-4px;border:1px solid rgba(131,141,151,.28);border-radius:50%}.module-icon::after{inset:6px;border-style:dotted}
    .module b{display:block;white-space:nowrap;font-size:14px;font-weight:600;letter-spacing:.5px}.module small{display:block;margin-top:7px;color:#69717b;white-space:nowrap;font-size:8px}.module em{display:block;width:16px;height:2px;margin:15px auto 0;background:#747c85;box-shadow:4px 0 0 #c2c7cc;font-style:normal}
    .fortune{position:relative;min-height:210px;margin-top:18px;overflow:hidden;padding:28px 29px;border-radius:19px}
    .fortune::after{content:"";position:absolute;z-index:0;inset:0;background:url('./assets/home-fortune-background.png') center/cover no-repeat;opacity:.72;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse 105% 105% at 68% 50%,#000 0 58%,rgba(0,0,0,.76) 72%,rgba(0,0,0,.24) 88%,transparent 100%);mask-image:radial-gradient(ellipse 105% 105% at 68% 50%,#000 0 58%,rgba(0,0,0,.76) 72%,rgba(0,0,0,.24) 88%,transparent 100%)}
    .fortune>*{position:relative;z-index:1}.fortune h2{margin:0 0 22px;font-size:17px;font-weight:500;letter-spacing:2px}.fortune h2::before{content:"✦";margin-right:8px;color:#77808a}.fortune p{margin:0;color:#5f6670;font-size:12px;line-height:2}.fortune cite{display:block;margin-top:15px;color:#676e77;font-size:11px;font-style:normal}.fortune a{display:inline-block;margin-top:28px;color:#555d67;font-size:12px;text-decoration:none}.fortune a::after{content:" ⟶";color:#8a929a}
    .toast{position:fixed;z-index:50;left:50%;bottom:96px;transform:translate(-50%,12px);padding:9px 15px;border-radius:18px;background:rgba(57,64,73,.88);color:#fff;font:11px sans-serif;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:430px){.content{padding-inline:20px}.module{padding-inline:2px}.module-icon{width:52px;height:52px;font-size:21px}.module b{font-size:12px}.module small{font-size:7px}.fortune{min-height:194px;padding:24px}.hero{height:121vw}}
    @media(max-width:360px){.content{padding-inline:14px}.module-icon{width:47px;height:47px}.module b{font-size:11px}.module small{font-size:6px}.fortune{padding-inline:21px}}
  </style>
</head>
<body class="home-page">
  <main class="home">
    <section class="hero" aria-label="青筮问道首页主视觉"><img class="hero-star-chart" src="./assets/home-star-chart-glow.png" alt="" aria-hidden="true"><span class="hero-logo-glow" aria-hidden="true"><i></i><i></i><i></i><i></i></span><img class="hero-vertical-logo" src="./assets/home-vertical-logo.png" alt="青筮问道"><p class="hero-vertical-motto">青衣筮卜　窥天问道</p><button class="menu" type="button" aria-label="打开菜单" onclick="soon()"><i></i><i></i><i></i></button></section>
    <div class="content">
      <section class="modules glass" id="applications" aria-label="核心功能">
        <a class="module" href="./chart.html"><span class="open-tag">已开放</span><span class="module-icon">|||</span><b>四柱八字</b><small>命理精批 · 运势详解</small><em></em></a>
        <a class="module" href="./liuyao.html"><span class="open-tag">已开放</span><span class="module-icon">☷</span><b>金钱六爻</b><small>占卜问事 · 吉凶预测</small><em></em></a>
        <a class="module" href="./hepan.html"><span class="open-tag">已开放</span><span class="module-icon">合</span><b>八字合盘</b><small>双盘参合 · 关系详解</small><em></em></a>
        <a class="module" href="#" onclick="soon(event)"><span class="module-icon">◉</span><b>AI问道</b><small>智能解惑 · 指引人生</small><em></em></a>
      </section>
      <section class="fortune glass">
        <h2>今日运势</h2>
        <p>天行健，君子以自强不息；<br>地势坤，君子以厚德载物。</p>
        <cite>——《周易·乾坤》</cite>
        <a href="#" onclick="soon(event)">查看今日运势</a>
      </section>
    </div>
  </main>
  <nav class="bottom-nav" aria-label="底部导航">
    <a class="active" href="./"><span>⌂</span>首页</a>
    <a href="#" data-global-archives><span>▤</span>档案</a>
    <a href="./applications.html"><span>◇</span>应用</a>
    <a href="#" onclick="soon(event)"><span>♙</span>我的</a>
  </nav>
  <div class="toast" id="toast">该功能正在整理中</div>
  <script>
    function soon(e){if(e)e.preventDefault();const t=document.querySelector('#toast');t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),1600)}
  </script>
  <script src="./app/archive-storage.js"></script><script src="./app/archive-manager.js"></script><script src="./app/viewport-mode.js"></script>
</body>
</html>

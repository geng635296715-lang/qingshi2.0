</section>`;document.body.appendChild(wheel);const wheelList=wheel.querySelector('.wheel-list'),wheelTitle=wheel.querySelector('#wheelTitle');let wheelSelect=null,wheelIndex=0,wheelFrame=0;function wheelLabel(el){let label=el.closest('label'),text=label?.childNodes[0]?.textContent?.trim();return text||'请选择'}function markWheel(i,scroll=true){let buttons=[...wheelList.querySelectorAll('.wheel-option')];if(!buttons.length)return;wheelIndex=Math.max(0,Math.min(i,buttons.length-1));buttons.forEach((b,n)=>b.classList.toggle('active',n===wheelIndex));if(scroll)buttons[wheelIndex].scrollIntoView({block:'center',behavior:'smooth'})}function openWheel(el){let options=[...el.options];if(!options.length)return;wheelSelect=el;wheelTitle.textContent=wheelLabel(el);wheelList.innerHTML=options.map((o,i)=>`<button type="button" class="wheel-option" data-index="${i}">${o.textContent}</button>`).join('');wheel.classList.add('show');requestAnimationFrame(()=>markWheel(Math.max(0,el.selectedIndex),false));requestAnimationFrame(()=>markWheel(Math.max(0,el.selectedIndex),true))}function closeWheel(){wheel.classList.remove('show');wheelSelect=null}wheelList.addEventListener('scroll',()=>{cancelAnimationFrame(wheelFrame);wheelFrame=requestAnimationFrame(()=>{let center=wheelList.getBoundingClientRect().top+wheelList.clientHeight/2,buttons=[...wheelList.querySelectorAll('.wheel-option')],nearest=0,distance=Infinity;buttons.forEach((b,i)=>{let r=b.getBoundingClientRect(),d=Math.abs(r.top+r.height/2-center);if(d<distance){distance=d;nearest=i}});markWheel(nearest,false)})},{passive:true});wheelList.addEventListener('click',e=>{let option=e.target.closest('.wheel-option');if(option)markWheel(Number(option.dataset.index))});wheel.querySelector('.wheel-cancel').onclick=closeWheel;wheel.querySelector('.wheel-confirm').onclick=()=>{if(!wheelSelect)return closeWheel();wheelSelect.selectedIndex=wheelIndex;wheelSelect.dispatchEvent(new Event('change',{bubbles:true}));closeWheel()};wheel.onclick=e=>{if
